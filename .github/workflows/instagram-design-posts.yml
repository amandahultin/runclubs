name: Render Instagram design posts

# Renders standalone HTML files (e.g. exported from a Claude Design project
# into posts/<week>/*.html) to PNG images sized for Instagram.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder of .html files to render (e.g. posts/vecka33)"
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-instagram.txt

      - name: Install Python dependencies
        run: pip install -r requirements-instagram.txt

      - name: Install Chromium (+ system deps + color emoji font)
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Render design posts
        run: python generate_design_post_images.py "${{ github.event.inputs.folder }}"

      - name: Upload rendered images as a workflow artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-design-posts
          path: ${{ github.event.inputs.folder }}/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Print artifact download link
        if: always() && steps.upload.outputs.artifact-id != ''
        run: |
          echo "### Instagram design posts" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download artifact](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ${{ steps.upload.outputs.artifact-url }}"
