name: Sync Instagram feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-instagram-feed.txt

      - run: pip install -r requirements-instagram-feed.txt

      - name: Fetch latest Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python sync_instagram_feed.py

      - name: Commit updated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/feed
          git diff --cached --quiet || git commit -m "Auto-update Instagram feed"
          git diff --cached --quiet || git push
