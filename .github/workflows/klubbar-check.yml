name: Klubbar check (temporary)

# Read-only: generates events.html from the current sheets and lists the
# weekly runs per club. Nothing is committed or written to any sheet.

on:
  push:
    branches: [klubbar-schema]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt
      - run: pip install -r requirements-events.txt
      - name: Generate events.html (not committed)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.EVENTS_SHEET_ID }}
        run: python generate_running_events.py /tmp/events.html 2>&1 | grep -E "WARNING|återkommande|Fetched"
      - name: Weekly runs per club
        run: |
          python - <<'PY'
          import json, re
          from collections import defaultdict
          from datetime import datetime
          text = open("/tmp/events.html", encoding="utf-8").read()
          events = json.loads(re.search(r"const events = (\[[\s\S]*?\]);", text).group(1))
          runs = defaultdict(set)
          for e in events:
              if e["source"] == "weekly_run":
                  d = datetime.fromisoformat(e["date"])
                  runs[(e["club"], e["link"])].add(f"{d:%a %H:%M} · {e['location']}")
          for (club, link), slots in sorted(runs.items()):
              print(f"{club} | {link} | {' ; '.join(sorted(slots))}")
          PY
