name: Klubbar schema migration (one-off)

# Runs on pushes to the klubbar-schema branch only. MODE controls whether the
# migration writes to the club sheet: "preview" writes nothing, "apply" writes
# the previewed changes. Switch to apply in a separate commit after review.

on:
  push:
    branches: [klubbar-schema]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODE: preview

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-events.txt

      - name: Install dependencies
        run: pip install -r requirements-events.txt

      - name: Migrate Klubbar schedule columns (${{ env.MODE }})
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.EVENTS_SHEET_ID }}
        run: |
          if [ "$MODE" = "apply" ]; then
            python migrate_klubbar_schema.py --apply --out-dir klubbar-preview
          else
            python migrate_klubbar_schema.py --out-dir klubbar-preview
          fi
          cat klubbar-preview/klubbar-preview.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate events.html from the current sheets (not committed)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.EVENTS_SHEET_ID }}
        run: python generate_running_events.py klubbar-preview/events.html 2>&1 | tee klubbar-preview/generate.log

      - name: Check that the new clubs are on /events
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, re
          text = open("klubbar-preview/events.html", encoding="utf-8").read()
          events = json.loads(re.search(r"const events = (\[[\s\S]*?\]);", text).group(1))
          print("\n## Klubbar på /events\n")
          for club in ["Sundet Run Club", "Social Run Landskrona", "STIG GBG",
                       "Run For a Bun Jönköping", "Grand Run Club"]:
              hits = [e for e in events if e["club"].strip() == club and e["source"] == "weekly_run"]
              first = f"{hits[0]['date']} → {hits[0]['link']}" if hits else ""
              print(f"- {'✅' if hits else '❌'} {club}: {len(hits)} pass {first}")
          EOF

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: klubbar-preview
          path: klubbar-preview/
